<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRCS Admin | 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --bg-color: #FFF3C2;
    --primary-color: #661414;
    --text-dark: #1a1a1a;
    --border-color: #d3c5a3;
    --font-serif: Georgia, "Times New Roman", Times, serif;
    --font-apple: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-color); color: var(--text-dark); font-family: var(--font-apple); line-height: 1.6; min-height: 100vh; }

.admin-login { position: fixed; inset: 0; background: var(--primary-color); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.admin-login.hidden { display: none; }
.login-box { background: var(--bg-color); padding: 44px 40px 36px; width: 100%; max-width: 400px; border-top: 4px solid var(--primary-color); box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
.login-box h1 { font-family: var(--font-serif); font-size: 24px; color: var(--primary-color); margin-bottom: 6px; }
.login-box p { font-size: 13px; opacity: 0.5; margin-bottom: 28px; color: var(--primary-color); }
.login-box label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--primary-color); opacity: 0.65; margin-bottom: 6px; margin-top: 14px; }
.login-box input { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); font-size: 15px; outline: none; font-family: var(--font-apple); }
.login-box input:focus { border-color: var(--primary-color); }
.login-box button { width: 100%; padding: 14px; margin-top: 20px; border: none; background: var(--primary-color); color: var(--bg-color); font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer; }
.login-box button:hover { background: #7d1a1a; }
.login-box button:disabled { opacity: 0.5; cursor: not-allowed; }
.login-msg { font-size: 13px; color: #b91c1c; margin-top: 12px; min-height: 18px; text-align: center; }

.admin-panel { display: none; }
.admin-panel.visible { display: block; }

.admin-header { background: var(--primary-color); color: var(--bg-color); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 50; }
.admin-header h1 { font-family: var(--font-serif); font-size: 20px; }
.admin-header .right { display: flex; gap: 16px; align-items: center; font-size: 13px; }
.admin-header .right b { font-weight: 800; }
.admin-header button { padding: 7px 16px; border: 1px solid rgba(255,243,194,0.5); background: transparent; color: var(--bg-color); font-size: 13px; font-weight: 600; cursor: pointer; }
.admin-header button:hover { background: rgba(255,243,194,0.15); }

.admin-layout { display: flex; min-height: calc(100vh - 56px); }
.admin-side { width: 200px; background: #fff; border-right: 1px solid var(--border-color); padding: 20px 0; flex-shrink: 0; }
.admin-side button { display: block; width: 100%; padding: 12px 24px; border: none; background: none; text-align: left; font-size: 14px; font-weight: 600; color: var(--text-dark); opacity: 0.6; cursor: pointer; border-left: 3px solid transparent; transition: all 0.2s; }
.admin-side button:hover { opacity: 0.9; background: rgba(102,20,20,0.04); }
.admin-side button.active { opacity: 1; color: var(--primary-color); border-left-color: var(--primary-color); background: rgba(102,20,20,0.06); }

.admin-content { flex: 1; padding: 28px 32px; min-width: 0; }
.admin-section { display: none; }
.admin-section.active { display: block; }
.admin-section h2 { font-family: var(--font-serif); font-size: 22px; color: var(--primary-color); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--border-color); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card { background: #fff; border: 1px solid var(--border-color); padding: 20px; text-align: center; }
.stat-card .num { font-size: 32px; font-weight: 800; color: var(--primary-color); line-height: 1; margin-bottom: 6px; }
.stat-card .label { font-size: 12px; opacity: 0.55; letter-spacing: 0.5px; text-transform: uppercase; }

.admin-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border-color); font-size: 14px; }
.admin-table th { background: var(--primary-color); color: var(--bg-color); padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; white-space: nowrap; }
.admin-table td { padding: 10px 14px; border-bottom: 1px solid var(--border-color); vertical-align: top; word-break: break-word; }
.admin-table tr:last-child td { border-bottom: none; }
.admin-table tr:hover td { background: rgba(255,243,194,0.4); }
.admin-table .btn-sm { padding: 4px 12px; border: 1px solid var(--border-color); background: transparent; font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 6px; font-family: var(--font-apple); }
.admin-table .btn-sm:hover { background: var(--primary-color); color: var(--bg-color); border-color: var(--primary-color); }
.admin-table .btn-sm.danger { color: #b91c1c; border-color: #b91c1c; }
.admin-table .btn-sm.danger:hover { background: #b91c1c; color: #fff; }

.empty-msg { padding: 50px 20px; text-align: center; color: var(--text-dark); opacity: 0.4; font-size: 15px; }

.form-box { background: #fff; border: 1px solid var(--border-color); padding: 24px; margin-bottom: 24px; }
.form-box h3 { font-family: var(--font-serif); font-size: 17px; color: var(--primary-color); margin-bottom: 16px; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: 0.6; margin-bottom: 6px; }
.form-row input, .form-row select, .form-row textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); font-size: 14px; font-family: var(--font-apple); outline: none; background: #fff; }
.form-row textarea { resize: vertical; min-height: 100px; }
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--primary-color); }
.form-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn { padding: 10px 22px; border: none; background: var(--primary-color); color: var(--bg-color); font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; font-family: var(--font-apple); }
.btn:hover { background: #7d1a1a; }
.btn-outline { background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); }
.btn-outline:hover { background: var(--primary-color); color: var(--bg-color); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--primary-color); color: var(--bg-color); padding: 12px 26px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.3); transition: transform 0.4s ease; z-index: 2000; max-width: calc(100vw - 40px); text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: #b91c1c; }
.toast.success { background: #15803d; }

.report-box { background: #fff; border: 1px solid var(--border-color); padding: 24px; font-family: var(--font-serif); }
.report-box h3 { color: var(--primary-color); margin-bottom: 16px; }
.report-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border-color); font-size: 15px; gap: 12px; }
.report-row:last-child { border-bottom: none; }
.report-row b { color: var(--primary-color); flex-shrink: 0; }
.bar-row { margin: 10px 0; }
.bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; gap: 10px; }
.bar-label span:first-child { flex: 1; min-width: 0; }
.bar-track { height: 10px; background: rgba(102,20,20,0.08); overflow: hidden; }
.bar-fill { height: 100%; background: var(--primary-color); transition: width 0.4s ease; }

.poem-tag { display: inline-block; padding: 2px 8px; background: rgba(102,20,20,0.08); color: var(--primary-color); font-size: 12px; font-weight: 600; margin-right: 6px; }
.poem-name { font-weight: 700; color: var(--primary-color); }
.poem-cat { font-size: 12px; opacity: 0.55; margin-left: 6px; }

@media (max-width: 800px) {
    .admin-layout { flex-direction: column; }
    .admin-side { width: 100%; display: flex; overflow-x: auto; padding: 0; border-right: none; border-bottom: 1px solid var(--border-color); }
    .admin-side button { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; padding: 12px 18px; }
    .admin-side button.active { border-left: none; border-bottom-color: var(--primary-color); }
    .admin-content { padding: 20px 16px; }
    .admin-table { font-size: 13px; }
    .admin-table th, .admin-table td { padding: 8px 10px; }
}
</style>
</head>
<body>

<div class="admin-login" id="adminLogin">
    <div class="login-box">
        <h1>DRCS 管理后台</h1>
        <p>Admin Panel · 仅限管理员访问</p>
        <label for="adminUser">用户名</label>
        <input type="text" id="adminUser" autocomplete="username">

        <div class="login-msg" id="loginMsg"></div>
    </div>
</div>

<div class="admin-panel" id="adminPanel">
    <div class="admin-header">
        <h1>DRCS 管理后台</h1>
        <div class="right">
            <span>管理员：<b id="adminName">-</b></span>
            <button onclick="adminLogout()">退出</button>
        </div>
    </div>

    <div class="admin-layout">
        <nav class="admin-side">
            <button class="active" data-section="dashboard">总览</button>
            <button data-section="posts">帖子管理</button>
            <button data-section="users">用户管理</button>
            <button data-section="content">内容管理</button>
            <button data-section="votes">投票统计</button>
            <button data-section="reports">报告生成</button>
        </nav>

        <div class="admin-content">
            <div class="admin-section active" id="section-dashboard">
                <h2>数据总览</h2>
                <div class="stat-grid" id="statGrid"></div>
                <div class="report-box">
                    <h3>最近动态</h3>
                    <div id="recentActivity"></div>
                </div>
            </div>

            <div class="admin-section" id="section-posts">
                <h2>帖子管理</h2>
                <div id="postsContainer"></div>
            </div>

            <div class="admin-section" id="section-users">
                <h2>用户管理</h2>
                <div id="usersContainer"></div>
            </div>

            <div class="admin-section" id="section-content">
                <h2>内容管理</h2>
                <div class="form-box">
                    <h3 id="contentFormTitle">新增内容</h3>
                    <input type="hidden" id="contentId">
                    <div class="form-row">
                        <label>所属栏目</label>
                        <select id="contentSection">
                            <option value="about">关于 About</option>
                            <option value="research">研究 Research</option>
                            <option value="journal">期刊 Journal</option>
                            <option value="contact">联系 Contact</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>内容类型</label>
                        <select id="contentType">
                            <option value="text">文本段落</option>
                            <option value="pdf">PDF 文档</option>
                            <option value="article">文章</option>
                            <option value="video">视频</option>
                            <option value="image">图片</option>
                            <option value="download">下载资源</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>标题 Title</label>
                        <input type="text" id="contentTitle" placeholder="例如：红楼梦版本源流考">
                    </div>
                    <div class="form-row">
                        <label>副标题 / 作者 Subtitle</label>
                        <input type="text" id="contentSubtitle" placeholder="例如：李济舟 · 2026">
                    </div>
                    <div class="form-row">
                        <label>正文内容 Body</label>
                        <textarea id="contentBody" placeholder="填写正文内容..."></textarea>
                    </div>
                    <div class="form-row">
                        <label>上传文件（PDF / 视频 / 图片）</label>
                        <input type="file" id="contentFile" accept=".pdf,video/*,image/*">
                        <div id="uploadStatus" style="font-size:12px;color:var(--primary-color);margin-top:6px;"></div>
                    </div>
                    <div class="form-row">
                        <label>或手动填写链接 Link（可选）</label>
                        <input type="text" id="contentLink" placeholder="https://...">
                    </div>
                    <div class="form-actions">
                        <button class="btn" id="contentSaveBtn" onclick="saveContent()">保存</button>
                        <button class="btn btn-outline" onclick="resetContentForm()">清空</button>
                    </div>
                </div>
                <div id="contentListContainer"></div>
            </div>

            <div class="admin-section" id="section-votes">
                <h2>投票统计</h2>
                <div id="votesContainer"></div>
            </div>

            <div class="admin-section" id="section-reports">
                <h2>报告生成</h2>
                <div class="form-box">
                    <h3>生成运营报告</h3>
                    <p style="font-size:14px;opacity:0.6;margin-bottom:16px;">点击下方按钮，生成当前站点的运营数据摘要。</p>
                    <div class="form-actions">
                        <button class="btn" onclick="generateReport()">生成报告</button>
                        <button class="btn btn-outline" onclick="copyReport()">复制报告文本</button>
                    </div>
                </div>
                <div class="report-box" id="reportBox" style="display:none;">
                    <h3>运营数据报告</h3>
                    <div id="reportContent"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Supabase
   ========================================================= */
const SUPABASE_URL = 'https://zxuaslahporafvujalpt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8cZ9lXBwdjfGYJ4aCGBCjg_Yh3Pvi-g';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   POEMS 数据（必须与 index.html 保持一致）
   ========================================================= */
var POEMS = {
    panci: { cn: "金陵十二钗判词", en: "JINLING REGISTERS", items: [
        { cn: "黛玉判词", en: "Lin Daiyu" }, { cn: "宝钗判词", en: "Xue Baochai" },
        { cn: "元春判词", en: "Jia Yuanchun" }, { cn: "探春判词", en: "Jia Tanchun" },
        { cn: "湘云判词", en: "Shi Xiangyun" }, { cn: "妙玉判词", en: "Miaoyu" },
        { cn: "熙凤判词", en: "Wang Xifeng" }, { cn: "秦可卿判词", en: "Qin Keqing" }
    ]},
    qu: { cn: "红楼梦十二支曲", en: "TWELVE SONGS", items: [
        { cn: "枉凝眉", en: "Vain Longing" }, { cn: "终身误", en: "A Life Misjudged" },
        { cn: "恨无常", en: "Regret of Impermanence" }, { cn: "分骨肉", en: "Separation of Kin" },
        { cn: "乐中悲", en: "Joy Amid Sorrow" }, { cn: "世难容", en: "A World Intolerable" },
        { cn: "聪明累", en: "Wisdom's Burden" }, { cn: "飞鸟各投林", en: "Birds Fly to the Woods" }
    ]},
    daiyu: { cn: "林黛玉诗作", en: "POEMS BY LIN DAIYU", items: [
        { cn: "葬花吟", en: "Burial of Flowers" }, { cn: "题帕三绝", en: "Three Poems" },
        { cn: "桃花行", en: "Song of Peach Blossoms" }, { cn: "秋窗风雨夕", en: "Autumn Window" },
        { cn: "五美吟·西施", en: "Five Beauties: Xi Shi" }, { cn: "琴曲四章", en: "Four Chapters" }
    ]},
    baoyu: { cn: "贾宝玉诗作", en: "POEMS BY JIA BAOYU", items: [
        { cn: "芙蓉女儿诔", en: "Elegy for the Hibiscus Maiden" },
        { cn: "姽婳词·其一", en: "Song of the Valiant Maid: I" },
        { cn: "姽婳词·其二", en: "Song of the Valiant Maid: II" },
        { cn: "紫菱洲歌", en: "Song of Purple Caltrop Isle" }
    ]},
    juhua: { cn: "菊花诗", en: "CHRYSANTHEMUM POEMS", items: [
        { cn: "宝钗·忆菊", en: "Baochai: Remembering" }, { cn: "宝玉·访菊", en: "Baoyu: Visiting" },
        { cn: "黛玉·咏菊", en: "Daiyu: Ode" }, { cn: "黛玉·问菊", en: "Daiyu: Questioning" },
        { cn: "黛玉·菊梦", en: "Daiyu: Dream" }, { cn: "探春·簪菊", en: "Tanchun: Wearing" }
    ]}
};

/* 把 poem_id 例如 "panci-0" 转换成 { name, category, categoryKey, index } */
function parsePoemId(poemId) {
    if (!poemId) return { name: '-', category: '-', categoryKey: '', index: -1 };
    var parts = String(poemId).split('-');
    var catKey = parts[0];
    var idx = parseInt(parts[1], 10);
    var cat = POEMS[catKey];
    if (!cat || isNaN(idx) || !cat.items[idx]) {
        return { name: poemId, category: '未知', categoryKey: catKey, index: idx };
    }
    return {
        name: cat.items[idx].cn,
        category: cat.cn,
        categoryKey: catKey,
        index: idx
    };
}

function poemDisplayName(poemId) {
    return parsePoemId(poemId).name;
}

/* =========================================================
   全局
   ========================================================= */
var adminUser = null;
var CACHE = { users: [], posts: [], replies: [], votes: [], content: [] };

function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || 'success');
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function esc(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtDate(iso) {
    if (!iso) return '-';
    try { return new Date(iso).toLocaleString('zh-CN'); } catch (e) { return iso; }
}

/* =========================================================
   登录
   ========================================================= */
function usernameToEmail(username) {
    var hex = '';
    var bytes = new TextEncoder().encode(username.toLowerCase());
    for (var i = 0; i < bytes.length && hex.length < 40; i++) {
        hex += bytes[i].toString(16).padStart(2, '0');
    }
    return hex + '@drcs.placeholder.com';
}

document.getElementById('adminLoginBtn').addEventListener('click', adminLogin);
document.getElementById('adminPass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') adminLogin();
});

async function adminLogin() {
    var username = document.getElementById('adminUser').value.trim();
    var pass = document.getElementById('adminPass').value;
    var msg = document.getElementById('loginMsg');
    var btn = document.getElementById('adminLoginBtn');

    if (!username || !pass) { msg.textContent = '请输入用户名和密码'; return; }

    btn.disabled = true; btn.textContent = '验证中...'; msg.textContent = '';

    try {
        var email = usernameToEmail(username);
        var { data, error } = await sb.auth.signInWithPassword({ email: email, password: pass });
        if (error) throw error;

        var { data: profile, error: pErr } = await sb
            .from('profiles').select('id, username, role')
            .eq('id', data.user.id).single();

        if (pErr || !profile || profile.role !== 'admin') {
            await sb.auth.signOut();
            msg.textContent = '该账号没有管理员权限';
            btn.disabled = false; btn.textContent = '登 录';
            return;
        }

        adminUser = profile;
        document.getElementById('adminLogin').classList.add('hidden');
        document.getElementById('adminPanel').classList.add('visible');
        document.getElementById('adminName').textContent = profile.username;

        await loadAll();
        renderDashboard();

    } catch (err) {
        var m = err.message || '登录失败';
        if (m.includes('Invalid login credentials')) m = '用户名或密码错误';
        msg.textContent = m;
        btn.disabled = false; btn.textContent = '登 录';
    }
}

async function adminLogout() {
    await sb.auth.signOut();
    adminUser = null;
    document.getElementById('adminLogin').classList.remove('hidden');
    document.getElementById('adminPanel').classList.remove('visible');
    document.getElementById('adminUser').value = '';
    document.getElementById('adminPass').value = '';
    document.getElementById('loginMsg').textContent = '';
    document.getElementById('adminLoginBtn').disabled = false;
    document.getElementById('adminLoginBtn').textContent = '登 录';
}

/* =========================================================
   侧边栏
   ========================================================= */
document.querySelectorAll('.admin-side button').forEach(function(btn) {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.admin-side button').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.admin-section').forEach(function(s) { s.classList.remove('active'); });
        btn.classList.add('active');
        var section = btn.dataset.section;
        document.getElementById('section-' + section).classList.add('active');
        if (section === 'dashboard') renderDashboard();
        if (section === 'posts') renderPosts();
        if (section === 'users') renderUsers();
        if (section === 'content') renderContentList();
        if (section === 'votes') renderVotes();
    });
});

/* =========================================================
   加载全部数据
   ========================================================= */
async function loadAll() {
    var [users, posts, replies, votes, content] = await Promise.all([
        sb.from('profiles').select('*').order('created_at', { ascending: false }),
        sb.from('posts').select('id, content, created_at, author:profiles(username)').order('created_at', { ascending: false }),
        sb.from('replies').select('id, content, created_at, author:profiles(username)').order('created_at', { ascending: false }),
        sb.from('votes').select('id, poem_id, created_at, user:profiles(username)').order('created_at', { ascending: false }),
        sb.from('site_content').select('*').order('created_at', { ascending: false })
    ]);
    CACHE.users = users.data || [];
    CACHE.posts = posts.data || [];
    CACHE.replies = replies.data || [];
    CACHE.votes = votes.data || [];
    CACHE.content = content.data || [];
}

/* =========================================================
   总览
   ========================================================= */
function renderDashboard() {
    var grid = document.getElementById('statGrid');
    grid.innerHTML =
        '<div class="stat-card"><div class="num">' + CACHE.users.length + '</div><div class="label">注册用户</div></div>' +
        '<div class="stat-card"><div class="num">' + CACHE.posts.length + '</div><div class="label">帖子总数</div></div>' +
        '<div class="stat-card"><div class="num">' + CACHE.replies.length + '</div><div class="label">回复总数</div></div>' +
        '<div class="stat-card"><div class="num">' + CACHE.votes.length + '</div><div class="label">投票总数</div></div>' +
        '<div class="stat-card"><div class="num">' + CACHE.content.length + '</div><div class="label">栏目内容</div></div>' +
        '<div class="stat-card"><div class="num">' + CACHE.users.filter(function(u) { return u.role === 'admin'; }).length + '</div><div class="label">管理员</div></div>';

    var recent = CACHE.posts.slice(0, 5);
    var box = document.getElementById('recentActivity');
    if (recent.length === 0) {
        box.innerHTML = '<div class="empty-msg">暂无动态</div>';
        return;
    }
    box.innerHTML = recent.map(function(p) {
        var preview = p.content.length > 60 ? p.content.slice(0, 60) + '...' : p.content;
        return '<div class="report-row"><span><b>@' + esc(p.author ? p.author.username : '未知') + '</b>：' + esc(preview) + '</span><span style="opacity:0.5;font-size:13px;">' + fmtDate(p.created_at) + '</span></div>';
    }).join('');
}

/* =========================================================
   帖子管理
   ========================================================= */
function renderPosts() {
    var c = document.getElementById('postsContainer');
    if (CACHE.posts.length === 0) { c.innerHTML = '<div class="empty-msg">暂无帖子</div>'; return; }

    var html = '<table class="admin-table"><thead><tr>' +
        '<th>ID</th><th>作者</th><th>内容</th><th>发布时间</th><th>操作</th>' +
        '</tr></thead><tbody>';
    CACHE.posts.forEach(function(p) {
        var preview = p.content.length > 80 ? p.content.slice(0, 80) + '...' : p.content;
        html += '<tr>' +
            '<td>' + p.id + '</td>' +
            '<td>@' + esc(p.author ? p.author.username : '未知') + '</td>' +
            '<td>' + esc(preview) + '</td>' +
            '<td style="font-size:12px;">' + fmtDate(p.created_at) + '</td>' +
            '<td><button class="btn-sm danger" onclick="deletePost(' + p.id + ')">删除</button></td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    c.innerHTML = html;
}

async function deletePost(id) {
    if (!confirm('确定删除这条帖子？相关回复和点赞也会一并删除。')) return;
    var { error } = await sb.from('posts').delete().eq('id', id);
    if (error) { showToast('删除失败：' + error.message, 'error'); return; }
    showToast('帖子已删除');
    await loadAll();
    renderPosts();
    renderDashboard();
}

/* =========================================================
   用户管理
   ========================================================= */
function renderUsers() {
    var c = document.getElementById('usersContainer');
    if (CACHE.users.length === 0) { c.innerHTML = '<div class="empty-msg">暂无用户</div>'; return; }

    var html = '<table class="admin-table"><thead><tr>' +
        '<th>用户名</th><th>Handle</th><th>角色</th><th>注册时间</th><th>操作</th>' +
        '</tr></thead><tbody>';
    CACHE.users.forEach(function(u) {
        var isAdmin = u.role === 'admin';
        var isSelf = adminUser && u.id === adminUser.id;
        html += '<tr>' +
            '<td><b>' + esc(u.username) + '</b></td>' +
            '<td>' + esc(u.handle || '-') + '</td>' +
            '<td>' + (isAdmin ? '🔑 管理员' : '👤 普通用户') + '</td>' +
            '<td style="font-size:12px;">' + fmtDate(u.created_at) + '</td>' +
            '<td>' +
                (isSelf ? '<span style="font-size:12px;opacity:0.5;">当前账号</span>' :
                 isAdmin
                    ? '<button class="btn-sm" onclick="toggleAdmin(\'' + u.id + '\', \'user\')">取消管理员</button>'
                    : '<button class="btn-sm" onclick="toggleAdmin(\'' + u.id + '\', \'admin\')">设为管理员</button>') +
            '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    c.innerHTML = html;
}

async function toggleAdmin(userId, newRole) {
    var label = newRole === 'admin' ? '设为管理员' : '取消管理员';
    if (!confirm('确定要' + label + '吗？')) return;
    var { error } = await sb.from('profiles').update({ role: newRole }).eq('id', userId);
    if (error) { showToast('操作失败：' + error.message, 'error'); return; }
    showToast('已更新角色');
    await loadAll();
    renderUsers();
    renderDashboard();
}

/* =========================================================
   内容管理
   ========================================================= */
function resetContentForm() {
    document.getElementById('contentId').value = '';
    document.getElementById('contentSection').value = 'about';
    document.getElementById('contentType').value = 'text';
    document.getElementById('contentTitle').value = '';
    document.getElementById('contentSubtitle').value = '';
    document.getElementById('contentBody').value = '';
    document.getElementById('contentLink').value = '';
    document.getElementById('contentFile').value = '';
    document.getElementById('uploadStatus').textContent = '';
    document.getElementById('contentFormTitle').textContent = '新增内容';
    document.getElementById('contentSaveBtn').textContent = '保存';
}

async function uploadFile(file) {
    var ext = file.name.split('.').pop().toLowerCase();
    var safeName = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    var { data, error } = await sb.storage.from('documents').upload(safeName, file, {
        cacheControl: '3600',
        upsert: false
    });
    if (error) throw error;
    return sb.storage.from('documents').getPublicUrl(safeName).data.publicUrl;
}

async function saveContent() {
    var id = document.getElementById('contentId').value;
    var section = document.getElementById('contentSection').value;
    var type = document.getElementById('contentType').value;
    var title = document.getElementById('contentTitle').value.trim();
    var subtitle = document.getElementById('contentSubtitle').value.trim();
    var body = document.getElementById('contentBody').value.trim();
    var link = document.getElementById('contentLink').value.trim();
    var fileInput = document.getElementById('contentFile');
    var status = document.getElementById('uploadStatus');

    var hasFile = fileInput.files && fileInput.files[0];
    if (!title && !body && !hasFile && !link) {
        showToast('请至少填写标题、内容或上传文件', 'error');
        return;
    }

    if (hasFile) {
        var file = fileInput.files[0];
        if (file.size > 50 * 1024 * 1024) {
            showToast('文件不能超过 50MB', 'error');
            return;
        }
        status.textContent = '上传中：' + file.name + '（' + (file.size / 1024 / 1024).toFixed(2) + ' MB）';
        try {
            link = await uploadFile(file);
            status.textContent = '✓ 上传完成';
            var ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'pdf') type = 'pdf';
            else if (['mp4','webm','ogg','mov'].indexOf(ext) !== -1) type = 'video';
            else if (['jpg','jpeg','png','gif','webp','svg'].indexOf(ext) !== -1) type = 'image';
            document.getElementById('contentType').value = type;
        } catch (e) {
            status.textContent = '';
            showToast('上传失败：' + (e.message || e), 'error');
            return;
        }
    }

    var payload = {
        section: section,
        content_type: type,
        title: title,
        subtitle: subtitle,
        body: body,
        link: link
    };

    var res;
    if (id) {
        res = await sb.from('site_content').update(payload).eq('id', id);
    } else {
        payload.created_by = adminUser.id;
        res = await sb.from('site_content').insert(payload);
    }

    if (res.error) { showToast('保存失败：' + res.error.message, 'error'); return; }
    showToast(id ? '内容已更新' : '内容已添加');
    resetContentForm();
    await loadAll();
    renderContentList();
}

function editContent(id) {
    var item = CACHE.content.find(function(x) { return x.id === id; });
    if (!item) return;
    document.getElementById('contentId').value = item.id;
    document.getElementById('contentSection').value = item.section;
    document.getElementById('contentType').value = item.content_type || 'text';
    document.getElementById('contentTitle').value = item.title || '';
    document.getElementById('contentSubtitle').value = item.subtitle || '';
    document.getElementById('contentBody').value = item.body || '';
    document.getElementById('contentLink').value = item.link || '';
    document.getElementById('contentFile').value = '';
    document.getElementById('uploadStatus').textContent = '';
    document.getElementById('contentFormTitle').textContent = '编辑内容 #' + item.id;
    document.getElementById('contentSaveBtn').textContent = '更新';
    document.querySelector('.admin-content').scrollIntoView({ behavior: 'smooth' });
}

async function deleteContent(id) {
    var item = CACHE.content.find(function(x) { return x.id === id; });
    if (!item) return;

    var willDeleteFile = !!(item.link && item.link.indexOf('/storage/v1/object/public/documents/') !== -1);
    var msg = willDeleteFile
        ? '确定删除这条内容？上传的文件也会一并从存储中删除。'
        : '确定删除这条内容？';
    if (!confirm(msg)) return;

    if (willDeleteFile) {
        try {
            var url = item.link;
            var marker = '/storage/v1/object/public/documents/';
            var path = url.substring(url.indexOf(marker) + marker.length);
            path = decodeURIComponent(path.split('?')[0]);
            var delRes = await sb.storage.from('documents').remove([path]);
            if (delRes.error) {
                console.warn('文件删除失败，但继续删除记录：', delRes.error);
            }
        } catch (e) {
            console.warn('解析文件路径失败：', e);
        }
    }

    var { error } = await sb.from('site_content').delete().eq('id', id);
    if (error) { showToast('删除失败：' + error.message, 'error'); return; }
    showToast(willDeleteFile ? '内容和文件已删除' : '内容已删除');
    await loadAll();
    renderContentList();
}

function renderContentList() {
    var c = document.getElementById('contentListContainer');
    if (CACHE.content.length === 0) {
        c.innerHTML = '<div class="empty-msg">暂无内容，可在上方添加</div>';
        return;
    }
    var sectionNames = { about: '关于', research: '研究', journal: '期刊', contact: '联系' };
    var html = '<table class="admin-table"><thead><tr>' +
        '<th>ID</th><th>栏目</th><th>类型</th><th>标题</th><th>副标题</th><th>创建时间</th><th>操作</th>' +
        '</tr></thead><tbody>';
    CACHE.content.forEach(function(item) {
        html += '<tr>' +
            '<td>' + item.id + '</td>' +
            '<td>' + esc(sectionNames[item.section] || item.section) + '</td>' +
            '<td>' + esc(item.content_type || 'text') + '</td>' +
            '<td><b>' + esc(item.title || '-') + '</b></td>' +
            '<td>' + esc(item.subtitle || '-') + '</td>' +
            '<td style="font-size:12px;">' + fmtDate(item.created_at) + '</td>' +
            '<td>' +
                '<button class="btn-sm" onclick="editContent(' + item.id + ')">编辑</button>' +
                '<button class="btn-sm danger" onclick="deleteContent(' + item.id + ')">删除</button>' +
            '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    c.innerHTML = html;
}

/* =========================================================
   投票统计（显示诗歌名称）
   ========================================================= */
function renderVotes() {
    var c = document.getElementById('votesContainer');
    if (CACHE.votes.length === 0) { c.innerHTML = '<div class="empty-msg">暂无投票记录</div>'; return; }

    var counts = {};
    CACHE.votes.forEach(function(v) {
        counts[v.poem_id] = (counts[v.poem_id] || 0) + 1;
    });
    var sorted = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; });
    var max = sorted.length > 0 ? Math.max.apply(null, sorted.map(function(k) { return counts[k]; })) : 0;

    var html = '<div class="report-box"><h3>投票排行（共 ' + CACHE.votes.length + ' 票）</h3>';
    sorted.forEach(function(k) {
        var pct = max > 0 ? (counts[k] / max * 100) : 0;
        var info = parsePoemId(k);
        html += '<div class="bar-row">' +
            '<div class="bar-label">' +
                '<span><span class="poem-name">' + esc(info.name) + '</span>' +
                '<span class="poem-cat">— ' + esc(info.category) + '</span></span>' +
                '<b>' + counts[k] + ' 票</b>' +
            '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div>' +
        '</div>';
    });
    html += '</div>';

    html += '<div style="margin-top:24px;"><h3 style="font-family:var(--font-serif);color:var(--primary-color);margin-bottom:12px;">投票明细</h3>';
    html += '<table class="admin-table"><thead><tr><th>ID</th><th>用户</th><th>投票对象</th><th>所属分类</th><th>时间</th><th>操作</th></tr></thead><tbody>';
    CACHE.votes.forEach(function(v) {
        var info = parsePoemId(v.poem_id);
        html += '<tr>' +
            '<td>' + v.id + '</td>' +
            '<td>@' + esc(v.user ? v.user.username : '-') + '</td>' +
            '<td><span class="poem-name">' + esc(info.name) + '</span></td>' +
            '<td style="font-size:12px;opacity:0.7;">' + esc(info.category) + '</td>' +
            '<td style="font-size:12px;">' + fmtDate(v.created_at) + '</td>' +
            '<td><button class="btn-sm danger" onclick="deleteVote(' + v.id + ')">删除</button></td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    c.innerHTML = html;
}

async function deleteVote(id) {
    if (!confirm('确定删除这条投票记录？')) return;
    var { error } = await sb.from('votes').delete().eq('id', id);
    if (error) { showToast('删除失败：' + error.message, 'error'); return; }
    showToast('投票记录已删除');
    await loadAll();
    renderVotes();
    renderDashboard();
}

/* =========================================================
   报告生成
   ========================================================= */
var lastReport = '';

function generateReport() {
    var totalUsers = CACHE.users.length;
    var totalAdmins = CACHE.users.filter(function(u) { return u.role === 'admin'; }).length;
    var totalPosts = CACHE.posts.length;
    var totalReplies = CACHE.replies.length;
    var totalVotes = CACHE.votes.length;
    var totalContent = CACHE.content.length;

    var today = new Date();
    var weekAgo = new Date(today.getTime() - 7 * 86400000);
    var postsThisWeek = CACHE.posts.filter(function(p) { return new Date(p.created_at) > weekAgo; }).length;
    var usersThisWeek = CACHE.users.filter(function(u) { return new Date(u.created_at) > weekAgo; }).length;

    var topPoem = '-', topCount = 0;
    var counts = {};
    CACHE.votes.forEach(function(v) { counts[v.poem_id] = (counts[v.poem_id] || 0) + 1; });
    Object.keys(counts).forEach(function(k) {
        if (counts[k] > topCount) { topCount = counts[k]; topPoem = k; }
    });
    var topPoemName = topPoem === '-' ? '-' : poemDisplayName(topPoem);

    var box = document.getElementById('reportBox');
    var content = document.getElementById('reportContent');
    box.style.display = 'block';

    var lines = [
        ['报告生成时间', fmtDate(today.toISOString())],
        ['', ''],
        ['— 用户 —', ''],
        ['注册用户总数', totalUsers],
        ['管理员数量', totalAdmins],
        ['本周新增用户', usersThisWeek],
        ['', ''],
        ['— 内容 —', ''],
        ['帖子总数', totalPosts],
        ['本周新增帖子', postsThisWeek],
        ['回复总数', totalReplies],
        ['栏目内容条目', totalContent],
        ['', ''],
        ['— 投票 —', ''],
        ['投票总数', totalVotes],
        ['得票最高的诗歌', topPoemName + '（' + topCount + ' 票）']
    ];

    content.innerHTML = lines.map(function(row) {
        if (!row[1] && !row[0]) return '<div style="height:8px;"></div>';
        if (!row[1]) return '<div style="font-family:var(--font-serif);color:var(--primary-color);font-size:16px;font-weight:bold;margin-top:12px;">' + esc(row[0]) + '</div>';
        return '<div class="report-row"><span>' + esc(row[0]) + '</span><b>' + esc(row[1]) + '</b></div>';
    }).join('');

    lastReport = lines.filter(function(r) { return r[1]; }).map(function(r) { return r[0] + '：' + r[1]; }).join('\n');
    showToast('报告已生成');
}

function copyReport() {
    if (!lastReport) { showToast('请先生成报告', 'error'); return; }
    if (navigator.clipboard) {
        navigator.clipboard.writeText(lastReport).then(function() {
            showToast('报告已复制到剪贴板');
        });
    } else {
        prompt('复制以下报告：', lastReport);
    }
}
</script>
